<html lang="ko">
<head>

<title>r/neowiz-design-ai — 디자인 · 이미지 생성 AI 페이지 모음</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--bg:#f0f2f5;--bg2:#f6f7f9;--border:#f0f2f5;--border2:#e2e5e9;--text:#1c1c1e;--sub:#576069;--muted:#878a8c;--accent:#0079d3;--upvote:#ff4500;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;min-height:100vh;}
.topnav{position:sticky;top:0;z-index:200;background:var(--white);border-bottom:1px solid var(--border2);height:48px;display:flex;align-items:center;padding:0 20px;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;}
.logo-icon{width:32px;height:32px;background:var(--upvote);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;}
.logo-txt{font-size:17px;font-weight:600;color:var(--text);}
.logo-txt span{color:var(--muted);font-weight:400;}
.srch{flex:1;max-width:480px;position:relative;}
.srch input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;font-family:'IBM Plex Sans KR',sans-serif;font-size:15px;color:var(--text);padding:7px 16px 7px 38px;outline:none;transition:all .15s;}
.srch input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,121,211,.12);}
.srch input::placeholder{color:var(--muted);}
.srch-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.nav-stat{margin-left:auto;font-size:14px;color:var(--muted);background:var(--bg2);padding:4px 12px;border-radius:20px;border:1px solid var(--border2);flex-shrink:0;}
.nav-stat b{color:var(--upvote);}.nav-updated{font-size:11px;color:var(--muted);flex-shrink:0;}
.layout{max-width:1360px;margin:0 auto;display:flex;gap:18px;padding:16px 14px;align-items:flex-start;}
.sl{width:220px;flex-shrink:0;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;}
.panel{background:var(--white);border:1px solid var(--border2);border-radius:6px;overflow:hidden;margin-bottom:10px;}
.panel-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px 6px;background:var(--bg2);border-bottom:1px solid var(--border2);}
.sort-btn{display:flex;align-items:center;gap:8px;padding:9px 13px;border:none;background:none;width:100%;text-align:left;font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;color:var(--sub);cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border);}
.sort-btn:last-of-type{border-bottom:none;}
.sort-btn:hover{background:var(--bg2);}
.sort-btn.active{background:#fff3f0;color:var(--upvote);font-weight:600;}
.sort-btn .si{font-size:15px;width:18px;text-align:center;}
.refresh-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 24px);margin:10px 12px;padding:7px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.refresh-btn:hover{background:#0067b3;}
.team-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;color:var(--text);transition:background .1s;border-bottom:1px solid var(--border);}
.team-btn:last-child{border-bottom:none;}
.team-btn:hover{background:var(--bg2);}
.team-pip{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.team-lbl{flex:1;}
.team-cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:1px 7px;flex-shrink:0;transition:all .15s;}
.main{flex:1;min-width:0;}
.type-filter-bar{background:var(--white);border:1px solid var(--border2);border-radius:6px;padding:14px 16px;margin-bottom:12px;}
.type-filter-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.type-chips{display:flex;flex-wrap:wrap;gap:7px;}
.type-chip{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:2px solid;background:none;font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.type-chip:hover{opacity:.85;transform:translateY(-1px);}
.type-chip.on{color:#fff!important;border-color:transparent!important;}
.tc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.filter-hint{font-size:12px;color:var(--muted);margin-top:8px;transition:all .2s;}
.feed-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.flbl{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
.post{background:var(--white);border:1px solid var(--border2);border-radius:6px;margin-bottom:8px;display:flex;transition:border-color .1s,box-shadow .1s;animation:su .2s both;overflow:hidden;cursor:pointer;}
.post:hover{border-color:#818384;box-shadow:0 2px 8px rgba(0,0,0,.06);}
@keyframes su{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.post-bar{width:6px;flex-shrink:0;}
.pc{flex:1;min-width:0;padding:10px 12px 9px 10px;}
.ptop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.team-flair{font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff;letter-spacing:.02em;white-space:nowrap;}
.type-flair{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;color:#fff;opacity:.85;white-space:nowrap;}
.pmeta{font-size:12px;color:var(--muted);}
.pmeta b{color:var(--sub);}
.ptitle{font-size:16px;font-weight:500;color:var(--text);line-height:1.35;margin-bottom:5px;}
.post:hover .ptitle{color:var(--accent);}
.psummary{font-size:13px;color:var(--sub);line-height:1.55;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pact{display:flex;align-items:center;gap:3px;}
.views-txt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;}
.pa{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:none;background:none;border-radius:3px;font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-decoration:none;transition:background .1s,color .1s;}
.pa:hover{background:var(--bg2);color:var(--text);}
.pa.open{color:var(--accent);}
.pa.open:hover{background:#e8f0fe;}
.sr{width:280px;flex-shrink:0;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;}
.tool-panel{background:var(--white);border:1px solid var(--border2);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.tool-panel-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px 6px;background:var(--bg2);border-bottom:1px solid var(--border2);}
.tool-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px;}
.tool-chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:3px;border:1.5px solid;cursor:pointer;background:none;font-family:'IBM Plex Sans KR',sans-serif;transition:all .12s;white-space:nowrap;}
.tool-chip:hover{opacity:.8;}
.tool-chip.on{color:#fff!important;border-color:transparent!important;}
.rank-item{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.rank-item:last-child{border-bottom:none;}
.rank-item:hover{background:var(--bg2);}
.rnum{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;min-width:16px;text-align:center;line-height:1.3;flex-shrink:0;}
.rbdy{flex:1;min-width:0;}
.rflair{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:2px;color:#fff;margin-bottom:2px;}
.rtitle{font-size:12px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rmeta{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-e{font-size:41px;margin-bottom:12px;display:block;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:transparent;border-radius:2px;}
.sr:hover::-webkit-scrollbar-thumb{background:var(--border2);}
.sl:hover::-webkit-scrollbar-thumb{background:var(--border2);}
</style>
</head>
