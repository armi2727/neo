name: Confluence AI 페이지 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * *'  # 한국 시간 오전 9시
    - cron: '0 3 * * *'  # 한국 시간 오후 12시
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 의존성 설치
        run: pip install requests
        
      - name: Confluence 데이터 수집 & HTML 빌드
        timeout-minutes: 8
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONF_TOKEN }}  # CONF_TOKEN 정상 매칭
        run: python neowiz-auto/scripts/build.py
        
      - name: index.html 배포
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # 💡 [해결] 에러를 내던 cp public/... 코드를 완전히 청소했습니다.
          # build.py가 프로젝트 루트의 index.html을 직접 고치므로 곧바로 git add 합니다.
          git add index.html
          
          # 변경 사항이 존재할 때만 안전하게 커밋하고 푸시합니다.
          git diff --staged --quiet || git commit -m "자동 업데이트"
          git push