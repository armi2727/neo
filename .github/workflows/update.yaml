name: Confluence AI 페이지 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * *'  # 한국 시간 오전 9시
    - cron: '0 3 * * *'  # 한국 시간 오후 12시
  workflow_dispatch:     # 수동 실행 버튼 활성화

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # 💡 [핵심 추가] 깃허브 액션이 웹사이트 배포(Pages) 시스템을 강제로 깨우고 실행할 수 있는 특수 권한을 부여합니다.
    permissions:
      contents: write
      pages: write
      id-token: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 의존성 설치
        run: pip install requests
        
      - name: Confluence 데이터 수집 & HTML 빌드
        timeout-minutes: 8
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONF_TOKEN }}
        run: python neowiz-auto/scripts/build.py
        
      - name: index.html 배포
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add index.html
          
          # 변경 사항이 있을 때만 안전하게 커밋하고 푸시합니다.
          git diff --staged --quiet || git commit -m "자동 업데이트"
          git push
