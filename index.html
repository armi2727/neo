<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>r/neowiz-design-ai — 디자인 · 이미지 생성 AI 페이지 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --white:#ffffff;
  --bg:#ffffff;
  --bg2:#f5f6f8;
  --bg3:#eef0f3;
  --border:#eaecf0;
  --border2:#dde0e5;
  --text:#111318;
  --sub:#4a5568;
  --muted:#8a94a6;
  --accent:#1a6ef5;
  --accent-light:#eff4ff;
  --accent-hover:#1558cc;
  --upvote:#e8410a;
  --radius:10px;
  --radius-sm:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;}

/* ── NAV ── */
.topnav{
  position:sticky;top:0;z-index:200;
  background:#ffffff;
  border-bottom:1.5px solid var(--border);
  height:52px;display:flex;align-items:center;
  padding:0 24px;gap:14px;
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0;}
.logo-icon{width:34px;height:34px;background:var(--upvote);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px rgba(232,65,10,.3);}
.logo-txt{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.logo-txt span{color:var(--muted);font-weight:400;}
.srch{position:relative;}
.srch input{
  width:100%;background:var(--bg2);
  border:1.5px solid var(--border2);
  border-radius:999px;
  font-family:'Pretendard',sans-serif;font-size:15px;color:var(--text);
  padding:11px 20px 11px 44px;outline:none;
  transition:all .18s;font-weight:400;
}
.srch input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,110,245,.1);}
.srch input::placeholder{color:var(--muted);}
.srch-ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.nav-stat{
  margin-left:auto;font-size:13px;font-weight:500;color:var(--sub);
  background:var(--bg);padding:5px 13px;border-radius:20px;
  border:1.5px solid var(--border2);flex-shrink:0;
}
.nav-stat b{color:var(--upvote);font-weight:700;}

/* ── LAYOUT ── */
.layout{max-width:1400px;margin:0 auto;display:flex;gap:16px;padding:18px 18px;align-items:flex-start;}
.sl{width:216px;flex-shrink:0;position:sticky;top:68px;max-height:calc(100vh - 84px);overflow-y:auto;display:flex;flex-direction:column;}
.panel{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.panel-title{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:9px 13px 7px;
  background:var(--bg3);border-bottom:1px solid var(--border);
}
.sort-btn{
  display:flex;align-items:center;gap:9px;
  padding:9px 13px;border:none;background:none;width:100%;
  text-align:left;font-family:'Pretendard',sans-serif;
  font-size:14px;color:var(--sub);cursor:pointer;
  transition:background .12s;border-bottom:1px solid var(--border);
}
.sort-btn:last-of-type{border-bottom:none;}
.sort-btn:hover{background:var(--bg2);}
.sort-btn.active{background:#fff5f2;color:var(--upvote);font-weight:600;}
.sort-btn .si{font-size:14px;width:18px;text-align:center;opacity:.8;}
.refresh-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:calc(100% - 24px);margin:10px 12px;padding:8px;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-family:'Pretendard',sans-serif;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all .15s;letter-spacing:-.01em;
  box-shadow:0 2px 8px rgba(26,110,245,.25);
}
.refresh-btn:hover{background:var(--accent-hover);box-shadow:0 3px 12px rgba(26,110,245,.35);transform:translateY(-1px);}
.team-btn{
  display:flex;align-items:center;gap:9px;
  padding:9px 13px;cursor:pointer;border:none;background:none;
  width:100%;text-align:left;
  font-family:'Pretendard',sans-serif;font-size:14px;color:var(--text);
  transition:background .12s;border-bottom:1px solid var(--border);
}
.team-btn:last-child{border-bottom:none;}
.team-btn:hover{background:var(--bg2);}
.team-pip{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.team-lbl{flex:1;font-weight:500;}
.team-cnt{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  color:var(--muted);background:var(--bg2);
  border:1px solid var(--border);border-radius:10px;
  padding:1px 7px;flex-shrink:0;transition:all .15s;font-weight:500;
}

/* ── MAIN ── */
.main{flex:1;min-width:0;}
.type-filter-bar{
  background:none;border:none;
  padding:0 0 4px;
  margin-bottom:8px;
}
.type-filter-title{
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  text-transform:none;color:var(--muted);margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.type-filter-title .tf-emoji{font-size:18px;line-height:1;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;}
.type-chip{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:20px;border:1.5px solid;
  background:none;font-family:'Pretendard',sans-serif;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.type-chip:hover{opacity:.82;transform:translateY(-1px);}
.type-chip.on{color:#fff!important;border-color:transparent!important;box-shadow:0 2px 8px rgba(0,0,0,.14);}
.tc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.filter-hint{font-size:12px;color:var(--muted);margin-top:9px;transition:all .2s;font-weight:400;}
.feed-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.flbl{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);font-weight:500;}

/* ── POST CARD ── */
.post{
  background:var(--white);
  border:none;
  border-bottom:1.5px solid var(--border);
  border-radius:0;
  margin-bottom:0;
  display:flex;
  transition:background .12s;
  animation:su .22s both;overflow:hidden;cursor:pointer;
}
.post:first-child{border-top:1.5px solid var(--border);}
.post:hover{background:#f8f9ff;}
@keyframes su{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.post-bar{width:4px;flex-shrink:0;}
.pc{flex:1;min-width:0;padding:20px 20px 18px 16px;}
.ptop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.team-flair{
  font-size:11.5px;font-weight:700;padding:2px 9px;
  border-radius:4px;color:#fff;letter-spacing:.01em;white-space:nowrap;
}
.type-flair{
  font-size:11px;font-weight:600;padding:2px 7px;
  border-radius:4px;color:#fff;white-space:nowrap;opacity:.9;
}
.pmeta{font-size:12px;color:var(--muted);font-weight:400;}
.pmeta b{color:var(--sub);font-weight:500;}
.ptitle{
  font-size:28px;font-weight:400;color:var(--text);
  line-height:1.35;margin-bottom:10px;letter-spacing:-.02em;
}
.post:hover .ptitle{color:var(--accent);}
.psummary{
  font-size:14px;color:var(--sub);line-height:1.75;
  margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  font-weight:400;
}
.pact{display:flex;align-items:center;gap:2px;}
.pa{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;border:none;background:none;
  border-radius:5px;font-family:'Pretendard',sans-serif;
  font-size:12px;font-weight:500;color:var(--muted);
  cursor:pointer;text-decoration:none;transition:background .1s,color .1s;
}
.pa:hover{background:var(--bg2);color:var(--text);}
.pa.open{color:var(--accent);}
.pa.open:hover{background:var(--accent-light);}

/* ── RIGHT SIDEBAR ── */
.sr{width:272px;flex-shrink:0;position:sticky;top:68px;max-height:calc(100vh - 84px);overflow-y:auto;}
.tool-panel{
  background:var(--white);
  border:none;
  border-bottom:1.5px solid var(--border);
  border-radius:0;
  margin-bottom:0;overflow:hidden;
}
.tool-panel-title{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:20px 4px 8px;
  background:var(--white);border-bottom:none;
}
.tool-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 16px;}
.tool-chip{
  font-size:14px;font-weight:600;padding:6px 13px;
  border-radius:6px;border:1.5px solid;cursor:pointer;
  background:none;font-family:'Pretendard',sans-serif;
  transition:all .12s;white-space:nowrap;
}
.tool-chip:hover{opacity:.78;}
.tool-chip.on{color:#fff!important;border-color:transparent!important;box-shadow:0 2px 6px rgba(0,0,0,.15);}

/* ── RANK ── */
.sr-section-label{
  font-size:20px;font-weight:700;letter-spacing:-.01em;text-transform:none;
  color:#111318;padding:20px 0 8px;display:flex;align-items:center;gap:6px;
}
.sr-section-label .sr-label-emoji{font-size:21px;line-height:1;}
.rank-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
}
.rank-item:last-child{border-bottom:none;}
.rank-item:hover .rtitle{color:var(--accent);}
.rnum{
  font-family:'IBM Plex Mono',monospace;font-size:15px;
  font-weight:700;min-width:16px;text-align:center;
  line-height:1.4;flex-shrink:0;
}
.rbdy{flex:1;min-width:0;}
.rflair{
  display:inline-block;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:3px;color:#fff;margin-bottom:3px;
}
.rtitle{
  font-size:15px;font-weight:500;color:#6b7280;
  line-height:1.55;margin-bottom:2px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  transition:color .12s;
}
.rmeta{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-weight:400;}
.sr-rank-block{border-bottom:1.5px solid var(--border);padding-bottom:4px;margin-bottom:0;}
.sr-rank-block:last-child{border-bottom:none;}
.sr-banner-block{padding-bottom:16px;}
.site-banner{
  display:block;text-decoration:none;
  border-radius:12px;overflow:hidden;
  margin-top:8px;position:relative;
  transition:transform .15s,box-shadow .15s;
}
.site-banner:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.site-banner-inner{
  position:relative;
  display:flex;align-items:center;gap:12px;
  padding:14px 14px;
}
.site-banner--confluence .site-banner-inner{background:rgba(0,82,204,.08);}
.site-banner--pandora .site-banner-inner{background:rgba(124,58,237,.08);}
.site-banner-icon{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
}
.site-banner-text{flex:1;min-width:0;}
.site-banner-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.site-banner-arrow{flex-shrink:0;color:var(--muted);opacity:.4;transition:opacity .15s;}
.site-banner:hover .site-banner-arrow{opacity:.8;}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-e{font-size:40px;margin-bottom:12px;display:block;}

/* ── LEFT SIDEBAR FLAT LIST ── */
.sl-page-title{
  font-size:28px;font-weight:800;
  line-height:1.4;letter-spacing:-.03em;
  padding:16px 4px 14px;cursor:pointer;
  transition:opacity .15s;
  background:linear-gradient(160deg,#ef9a9a 0%,#b39ddb 40%,#90caf9 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  display:inline-block;
  width:100%;
}
.sl-page-title:hover{opacity:.7;}
.sl-section-label{
  font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:none;
  color:var(--muted);padding:16px 4px 7px;
  display:flex;align-items:center;gap:6px;
}
.sl-section-label:first-child{padding-top:4px;}
.sl-section-label .sl-label-emoji{font-size:18px;line-height:1;}
.sl-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;cursor:pointer;border:none;background:none;
  width:100%;text-align:left;font-family:'Pretendard',sans-serif;
  font-size:20px;color:#4a5568;font-weight:500;
  border-radius:8px;transition:background .12s;
}
.sl-item:hover{background:rgba(0,0,0,.05);}
.sl-item.active{background:var(--accent-light);color:var(--accent);font-weight:600;}
.sl-item .si{font-size:14px;width:18px;text-align:center;opacity:.7;}
.sl-item-lbl{flex:1;}
.sl-item-cnt{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  color:var(--muted);background:var(--bg3);
  border-radius:10px;padding:1px 7px;flex-shrink:0;
}
.sl-item.active .sl-item-cnt{background:rgba(26,110,245,.15);color:var(--accent);}
.sl-divider{height:1px;background:var(--border);margin:6px 0;}
.sl-refresh{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:12px 10px;margin-top:4px;
  background:var(--accent);color:#fff;
  border:none;border-radius:10px;
  font-family:'Pretendard',sans-serif;font-size:16px;font-weight:600;
  cursor:pointer;transition:all .15s;
  box-shadow:0 2px 8px rgba(26,110,245,.25);
}
.sl-confluence-link{
  display:flex;align-items:center;gap:7px;
  font-size:14px;font-weight:500;color:var(--accent);
  text-decoration:none;padding:8px 10px;
  border-radius:8px;transition:background .12s;
  margin-bottom:8px;
}
.sl-confluence-link:hover{background:var(--accent-light);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:transparent;border-radius:2px;}
.sr:hover::-webkit-scrollbar-thumb{background:var(--border2);}
.sl:hover::-webkit-scrollbar-thumb{background:var(--border2);}
</style>
</head>

  </aside>
  <main class="main">
    <div class="type-filter-bar">
      <div class="type-filter-title"><span class="tf-emoji">🎨</span>작업 유형 필터</div>

const PAGES=[

];
const TOP_VERSION=[
  {team:"레드",title:"[ArtCraft] Pix Ai - 모델 & LoRA 종류",url:"https://neowiz.atlassian.net/wiki/spaces/1122/pages/236782243/ArtCraft+Pix+Ai+-+LoRA",version:28,watchers:25},
  {team:"퍼플",title:"[Art Craft] 일관성 앱(크래프트캠프) 사용방법_응용편",url:"https://neowiz.atlassian.net/wiki/spaces/1107/pages/218923700/Art+Craft+_",version:12,watchers:44},
  {team:"퍼플",title:"[Art Craft] Slot Agent Studio — 버튼 하나로 완성되는 AI 슬롯 에이전트",url:"https://neowiz.atlassian.net/wiki/spaces/1107/pages/237306784/Art+Craft+Slot+Agent+Studio+AI",version:12,watchers:44},
  {team:"퍼플",title:"[Artcraft] Pet_Story_Dad_didn't_Want_a_Dog 빅윈 시 사용 될 영상 제작 2",url:"https://neowiz.atlassian.net/wiki/spaces/1107/pages/276464706/Artcraft+Pet_Story_Dad_didn+t_Want_a_Dog+2",version:10,watchers:44},
  {team:"블루",title:"[Art Craft] 쇼다운 홀덤 HOP 글로벌 폰트 테스트 툴 제작",url:"https://neowiz.atlassian.net/wiki/spaces/1109/pages/145196336/Art+Craft+HOP",version:9,watchers:21}
];
const TOP_REACTION=[
  {team:"브라운",title:"[ArtCraft] AI UX/UI Design 세미나 자료",url:"https://neowiz.atlassian.net/wiki/spaces/1234/pages/212140154/ArtCraft+AI+UX+UI+Design",total:28,label:"👏8 😀1 😍3 👍16"},

  {team:"퍼플",title:"[Art Craft] 일관성 앱(크래프트캠프) 사용방법_응용편",url:"https://neowiz.atlassian.net/wiki/spaces/1107/pages/218923700/Art+Craft+_",total:8,label:"👏8"},

  {team:"블루",title:"[Art Craft] 쇼다운 홀덤 HOP 글로벌 폰트 테스트 툴 제작",url:"https://neowiz.atlassian.net/wiki/spaces/1109/pages/145196336/Art+Craft+HOP",total:6,label:"👏1 👍5"}
>>>>>>> Stashed changes
];

const PAGES=[

];
const seen=new Set();
const UP=PAGES.filter(p=>{if(seen.has(p.url))return false;seen.add(p.url);return true;});
let selTeams=new Set(),selTypes=new Set(),curSort="newest",curSearch="";

function getFiltered(){
  return UP.filter(p=>{
    const tOk=selTeams.size===0||selTeams.has(p.team);
    const tyOk=selTypes.size===0||[...selTypes].some(t=>(p.types||[]).includes(t));
    const q=curSearch.toLowerCase();
    const sOk=!q||p.title.toLowerCase().includes(q)||(p.summary||'').toLowerCase().includes(q)||(p.author||'').toLowerCase().includes(q)||(p.tools||[]).join(' ').toLowerCase().includes(q)||p.team.toLowerCase().includes(q)||(p.types||[]).join(' ').toLowerCase().includes(q);
    return tOk&&tyOk&&sOk;
  }).sort((a,b)=>{
    if(curSort==='newest')return b.date.localeCompare(a.date);
    if(curSort==='views')return(b.views||0)-(a.views||0);
    return a.title.localeCompare(b.title,'ko');
  });
}

function toggleTeam(team){
  // 단일 선택: 같은 팀 다시 누르면 전체로
  if(selTeams.size===1&&selTeams.has(team)||team==='ALL'){selTeams.clear();}
  else{selTeams.clear();if(team!=='ALL')selTeams.add(team);}
  // 검색어 초기화
  curSearch='';
  const si=document.querySelector('.srch input');
  if(si) si.value='';
  updateTeamUI();render();
}

function updateTeamUI(){
  const teams=["레드","퍼플","블루","브라운","올림포스","공용"];
  const allB=document.getElementById('tb-ALL');
  if(selTeams.size===0){allB.classList.add('active');}
  else{allB.classList.remove('active');allB.style.background='';allB.style.color='';}
  teams.forEach(t=>{
    const b=document.getElementById('tb-'+t);
    const c=TC[t];
    const cnt=b.querySelector('.sl-item-cnt');
    if(selTeams.has(t)){b.style.background=c.p+'66';b.style.color=c.t;if(cnt){cnt.style.background=c.s;cnt.style.color='#fff';cnt.style.borderColor='transparent';}}
    else{b.style.background='';b.style.color='';if(cnt){cnt.style.background='';cnt.style.color='';cnt.style.borderColor='';}}
  });
}

function renderTypeChips(){
  document.getElementById('typeChips').innerHTML=Object.entries(TYC).map(([t,c])=>
    `<button class="type-chip" id="tc-${t}" style="color:${c.bg};border-color:${c.bg}" onclick="toggleType('${t}',this)"><span class="tc-dot" style="background:${c.bg}"></span>${c.lb}</button>`
  ).join('');
}

function toggleType(type,chip){
  if(selTypes.has(type)){selTypes.delete(type);const c=TYC[type];chip.classList.remove('on');chip.style.background='';chip.style.color=c.bg;chip.style.borderColor=c.bg;}
  else{selTypes.add(type);chip.classList.add('on');chip.style.background=TYC[type].bg;chip.style.color='#fff';chip.style.borderColor='transparent';}
  updateHint();render();
}

function updateHint(){
  const h=document.getElementById('filterHint');
  if(selTypes.size===0){h.textContent='전체 작업 유형 표시 중 · 복수 선택 가능';h.style.color='';h.style.fontWeight='';}
  else{h.textContent='선택됨: '+[...selTypes].map(t=>TYC[t].lb).join(', ');h.style.color='var(--accent)';h.style.fontWeight='600';}
}

function setSort(s,btn){
  curSort=s;
  document.querySelectorAll('#sort-newest,#sort-views').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function refreshPage(){
  window.location.reload();
}

function renderToolChips(){
  const cnt={};UP.forEach(p=>(p.tools||[]).forEach(t=>{cnt[t]=(cnt[t]||0)+1;}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,16);
  document.getElementById('toolChips').innerHTML=top.map(([t,n],i)=>{
    const c=TOOLCOLS[i%TOOLCOLS.length];
    return `<button class="tool-chip" id="toolc-${t.replace(/[\s&]/g,'_')}" style="color:${c};border-color:${c}" onclick="searchTool('${t}',this)" title="${n}개">${t}</button>`;
  }).join('');
}

function searchTool(tool,chip){
  if(curSearch===tool){curSearch='';document.getElementById('searchInput').value='';renderToolChips();}
  else{curSearch=tool;document.getElementById('searchInput').value=tool;document.querySelectorAll('.tool-chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');chip.style.background=chip.style.color;chip.style.color='#fff';chip.style.borderColor='transparent';}
  render();
}

function updateCounts(){
  document.getElementById('totalCount').textContent=UP.length;
  document.getElementById('cnt-ALL').textContent=UP.length;
  ["레드","퍼플","블루","브라운","올림포스","공용"].forEach(t=>{const el=document.getElementById('cnt-'+t);if(el)el.textContent=UP.filter(p=>p.team===t).length;});
}

function render(){
  const list=getFiltered();
  document.getElementById('feedLabel').textContent=list.length+'개 페이지';
  const parts=[];
  if(selTeams.size>0)parts.push([...selTeams].join(', '));
  if(selTypes.size>0)parts.push([...selTypes].map(t=>TYC[t].lb).join(', '));
  if(curSearch)parts.push('"'+curSearch+'"');
  document.getElementById('activeFiltersLabel').textContent=parts.length?'필터: '+parts.join(' · '):'';
  const el=document.getElementById('postList');
  if(!list.length){el.innerHTML='<div class="empty"><span class="empty-e">🎨</span><div style="font-size:17px;font-weight:600;margin-bottom:6px">결과가 없습니다</div><div style="font-size:14px">다른 조건을 시도해 보세요</div></div>';return;}
  el.innerHTML=list.map((p,i)=>{
    const tc=TC[p.team]||{p:'#ccc',s:'#888',t:'#333'};
    const tfl=(p.types||[]).map(t=>{const c=TYC[t];return c?`<span class="type-flair" style="background:${c.bg}">${c.lb}</span>`:''}).join('');
    return `<div class="post" style="animation-delay:${Math.min(i,15)*0.025}s" onclick="window.open('${p.url}','_blank')">
      <div class="post-bar" style="background:${tc.p}"></div>
      <div class="pc">
        <div class="ptop"><span class="team-flair" style="background:${tc.s}">${p.team}</span>${tfl}<span class="pmeta">space/<b>${p.space}</b> · ${p.date}</span></div>
        <div class="ptitle">${p.title}</div>
        <div class="psummary">${p.summary||''}</div>
        <div class="pact" onclick="event.stopPropagation()">
          
          <a class="pa open" href="${p.url}" target="_blank" rel="noopener"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>열기</a>
          <button class="pa" onclick="navigator.clipboard&&navigator.clipboard.writeText('${p.url}').then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='복사',1200)})">복사</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderRankings(){
  const nc5=['#ff4500','#ff7043','#ffa726','#878a8c','#878a8c'];
  const ncB=['#0079d3','#1565c0','#42a5f5','#878a8c','#878a8c'];
  const ncG=['#16a34a','#22c55e','#86efac','#878a8c','#878a8c'];

  // 반응 많은 글 (이모티콘 합산)
  document.getElementById('topNew').innerHTML=TOP_REACTION.map((p,i)=>{
    const tc=TC[p.team]||{s:'#888'};
    return `<div class="rank-item" onclick="window.open('${p.url}','_blank')"><span class="rnum" style="color:${nc5[i]}">${i+1}</span><div class="rbdy"><div class="rtitle">${p.title}</div><div class="rmeta">${p.label}</div></div></div>`;
  }).join('');

  // 구독자 많은 글
  document.getElementById('topWatchers').innerHTML=TOP_WATCHERS.map((p,i)=>{
    const tc=TC[p.team]||{s:'#888'};
    return `<div class="rank-item" onclick="window.open('${p.url}','_blank')"><span class="rnum" style="color:${ncB[i]}">${i+1}</span><div class="rbdy"><div class="rtitle">${p.title}</div><div class="rmeta">👀 ${p.watchers}명 · ✏️${p.version}회</div></div></div>`;
  }).join('');

  // 수정 많은 글
  document.getElementById('topVersion').innerHTML=TOP_VERSION.map((p,i)=>{
    const tc=TC[p.team]||{s:'#888'};
    return `<div class="rank-item" onclick="window.open('${p.url}','_blank')"><span class="rnum" style="color:${ncG[i]}">${i+1}</span><div class="rbdy"><div class="rtitle">${p.title}</div><div class="rmeta">✏️ ${p.version}회 · 👀${p.watchers}명</div></div></div>`;
  }).join('');
}
updateCounts();renderTypeChips();renderToolChips();renderRankings();updateHint();updateTeamUI();render();
