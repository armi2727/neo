const seen=new Set();
const UP=PAGES.filter(p=>{if(seen.has(p.url))return false;seen.add(p.url);return true;});
let selTeams=new Set(),selTypes=new Set(),curSort="newest",curSearch="";

function getFiltered(){
  return UP.filter(p=>{
    const tOk=selTeams.size===0||selTeams.has(p.team);
    const tyOk=selTypes.size===0||[...selTypes].every(t=>(p.types||[]).includes(t));
    const q=curSearch.toLowerCase();
    const sOk=!q||p.title.toLowerCase().includes(q)||(p.summary||'').toLowerCase().includes(q)||(p.author||'').toLowerCase().includes(q)||(p.tools||[]).join(' ').toLowerCase().includes(q)||p.team.toLowerCase().includes(q)||(p.types||[]).join(' ').toLowerCase().includes(q);
    return tOk&&tyOk&&sOk;
  }).sort((a,b)=>{
    if(curSort==='newest')return b.date.localeCompare(a.date);
    if(curSort==='views')return(b.views||0)-(a.views||0);
    return a.title.localeCompare(b.title,'ko');
  });
}

function toggleTeam(team){
  // 단일 선택: 같은 팀 다시 누르면 전체로
  if(selTeams.size===1&&selTeams.has(team)||team==='ALL'){selTeams.clear();}
  else{selTeams.clear();if(team!=='ALL')selTeams.add(team);}
  updateTeamUI();render();
}

function updateTeamUI(){
  const teams=["레드","퍼플","블루","브라운","올림포스","공용"];
  const allB=document.getElementById('tb-ALL');
  if(selTeams.size===0){allB.style.background='#fff3f0';allB.style.color='var(--upvote)';}
  else{allB.style.background='';allB.style.color='';}
  teams.forEach(t=>{
    const b=document.getElementById('tb-'+t);
    const c=TC[t];
    const cnt=b.querySelector('.team-cnt');
    if(selTeams.has(t)){b.style.background=c.p+'55';b.style.color=c.t;cnt.style.background=c.s;cnt.style.color='#fff';cnt.style.borderColor='transparent';}
    else{b.style.background='';b.style.color='';cnt.style.background='';cnt.style.color='';cnt.style.borderColor='';}
  });
}

function renderTypeChips(){
  document.getElementById('typeChips').innerHTML=Object.entries(TYC).map(([t,c])=>
    `<button class="type-chip" id="tc-${t}" style="color:${c.bg};border-color:${c.bg}" onclick="toggleType('${t}',this)"><span class="tc-dot" style="background:${c.bg}"></span>${c.lb}</button>`
  ).join('');
}

function toggleType(type,chip){
  if(selTypes.has(type)){selTypes.delete(type);const c=TYC[type];chip.classList.remove('on');chip.style.background='';chip.style.color=c.bg;chip.style.borderColor=c.bg;}
  else{selTypes.add(type);chip.classList.add('on');chip.style.background=TYC[type].bg;chip.style.color='#fff';chip.style.borderColor='transparent';}
  updateHint();render();
}

function updateHint(){
  const h=document.getElementById('filterHint');
  if(selTypes.size===0){h.textContent='전체 작업 유형 표시 중. 클릭하면 복수 선택 가능합니다.';h.style.color='';h.style.fontWeight='';}
  else{h.textContent='선택됨: '+[...selTypes].map(t=>TYC[t].lb).join(', ');h.style.color='var(--accent)';h.style.fontWeight='600';}
}

function setSort(s,btn){curSort=s;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function refreshPage(){
  window.location.reload();
}

function renderToolChips(){
  const cnt={};UP.forEach(p=>(p.tools||[]).forEach(t=>{cnt[t]=(cnt[t]||0)+1;}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,16);
  document.getElementById('toolChips').innerHTML=top.map(([t,n],i)=>{
    const c=TOOLCOLS[i%TOOLCOLS.length];
    return `<button class="tool-chip" id="toolc-${t.replace(/[\s&]/g,'_')}" style="color:${c};border-color:${c}" onclick="searchTool('${t}',this)" title="${n}개">${t}</button>`;
  }).join('');
}

function searchTool(tool,chip){
  if(curSearch===tool){curSearch='';document.getElementById('searchInput').value='';renderToolChips();}
  else{curSearch=tool;document.getElementById('searchInput').value=tool;document.querySelectorAll('.tool-chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');chip.style.background=chip.style.color;chip.style.color='#fff';chip.style.borderColor='transparent';}
  render();
}

function updateCounts(){
  document.getElementById('totalCount').textContent=UP.length;
  document.getElementById('cnt-ALL').textContent=UP.length;
  ["레드","퍼플","블루","브라운","올림포스","공용"].forEach(t=>{const el=document.getElementById('cnt-'+t);if(el)el.textContent=UP.filter(p=>p.team===t).length;});
}

function render(){
  const list=getFiltered();
  document.getElementById('feedLabel').textContent=list.length+'개 페이지';
  const parts=[];
  if(selTeams.size>0)parts.push([...selTeams].join(', '));
  if(selTypes.size>0)parts.push([...selTypes].map(t=>TYC[t].lb).join(', '));
  if(curSearch)parts.push('"'+curSearch+'"');
  document.getElementById('activeFiltersLabel').textContent=parts.length?'필터: '+parts.join(' · '):'';
  const el=document.getElementById('postList');
  if(!list.length){el.innerHTML='<div class="empty"><span class="empty-e">🎨</span><div style="font-size:17px;font-weight:600;margin-bottom:6px">결과가 없습니다</div><div style="font-size:14px">다른 조건을 시도해 보세요</div></div>';return;}
  el.innerHTML=list.map((p,i)=>{
    const tc=TC[p.team]||{p:'#ccc',s:'#888',t:'#333'};
    const tfl=(p.types||[]).map(t=>{const c=TYC[t];return c?`<span class="type-flair" style="background:${c.bg}">${c.lb}</span>`:''}).join('');
    return `<div class="post" style="animation-delay:${Math.min(i,15)*0.025}s" onclick="window.open('${p.url}','_blank')">
      <div class="post-bar" style="background:${tc.p}"></div>
      <div class="pc">
        <div class="ptop"><span class="team-flair" style="background:${tc.s}">${p.team}</span>${tfl}<span class="pmeta">space/<b>${p.space}</b> · ${p.date}</span></div>
        <div class="ptitle">${p.title}</div>
        <div class="psummary">${p.summary||''}</div>
        <div class="pact" onclick="event.stopPropagation()">
          <span class="views-txt"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${(p.views||0).toLocaleString()}</span>
          <a class="pa open" href="${p.url}" target="_blank" rel="noopener"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>열기</a>
          <button class="pa" onclick="navigator.clipboard&&navigator.clipboard.writeText('${p.url}').then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='복사',1200)})">복사</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderRankings(){
  const bV=[...UP].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
  document.getElementById('topViews').innerHTML=bV.map((p,i)=>{const tc=TC[p.team]||{s:'#888'};const nc=['#ff4500','#ff7043','#ffa726','#878a8c','#878a8c'][i];return `<div class="rank-item" onclick="window.open('${p.url}','_blank')"><span class="rnum" style="color:${nc}">${i+1}</span><div class="rbdy"><div class="rflair" style="background:${tc.s}">${p.team}</div><div class="rtitle">${p.title}</div><div class="rmeta">👁 ${(p.views||0).toLocaleString()}</div></div></div>`;}).join('');
  const bD=[...UP].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  document.getElementById('topNew').innerHTML=bD.map((p,i)=>{const tc=TC[p.team]||{s:'#888'};const nc=['#0079d3','#1565c0','#42a5f5','#878a8c','#878a8c'][i];return `<div class="rank-item" onclick="window.open('${p.url}','_blank')"><span class="rnum" style="color:${nc}">${i+1}</span><div class="rbdy"><div class="rflair" style="background:${tc.s}">${p.team}</div><div class="rtitle">${p.title}</div><div class="rmeta">${p.date}</div></div></div>`;}).join('');
}

updateCounts();renderTypeChips();renderToolChips();renderRankings();updateHint();updateTeamUI();render();

</script>
